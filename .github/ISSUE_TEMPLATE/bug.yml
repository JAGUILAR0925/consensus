name: Reporte de error
description: Informar un comportamiento inesperado o incorrecto
title: "[Error]: "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica claramente qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a...
        2. Realizar...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y contexto
      description: Capturas, registros, entorno o cualquier detalle útil. No incluyas secretos ni datos personales.
